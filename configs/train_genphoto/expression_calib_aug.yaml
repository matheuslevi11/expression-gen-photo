# Absolute-calibration experiment (2026-10-02, docs/experiments/2026-10-02-calibration-augmentation.md)
# -- AUGMENTED arm.
# The pair expression_calib_aug / expression_calib_ctrl differs ONLY in train_data.sequence_mode_probs.
# Run each on 1 node x 4 H100 (scripts/slurm/train_expression_sdumont2nd.srm with
# --nodes=1), 25k steps (the 2026-08-11 dose-response plateau), effective batch 4.
#
# FILL IN BEFORE RUNNING: every /path/to/... placeholder below. Keep the filled-in
# copy outside git (see CLAUDE.md).

resume_from: null   # do NOT copy the RTX-3090 lineage's checkpoint-step-23000.ckpt here;
                     # set explicitly to a /petrobr/... checkpoint only if deliberately
                     # continuing a specific prior cluster run.

output_dir: "./output/calibration/aug"
# /petrobr/crono is the project's shared scratch (group `crono`, no backup).
# Do not use /petrobr/home/<user> here (100GB quota) — checkpoints are large.
pretrained_model_path: "/path/to/stable-diffusion-v1-5"
unet_subfolder: "unet_merged"

train_data:
  root_path:        "/path/to/MEAD_processed"
  annotation_json:  "annotations/train.json"
  clip_model_path:  "/path/to/stable-diffusion-v1-5"
  sample_n_frames:  5
  sample_size:      [256, 384]
  is_Train:         true
  prompt_template:  "<smile intensity: {value:.3f}>"
  emotion_filter:   "happy"
  # 50% sorted ramps (current behaviour), 30% constant sequences (level drawn uniformly
  # over 0.0..1.0, frames within +-0.1 from any clip supporting it -> rebalances toward
  # rare low AU12), 20% permuted ramps. Conditioning = the shown frames' own AU12 labels.
  sequence_mode_probs: {ramp: 0.5, constant: 0.3, permuted: 0.2}
  constant_levels: 11
  constant_level_tolerance: 0.1

validation_data:
  root_path:        "/path/to/MEAD_processed"
  annotation_json:  "annotations/validation.json"
  clip_model_path:  "/path/to/stable-diffusion-v1-5"
  sample_n_frames:  5
  sample_size:      [256, 384]
  is_Train:         false
  prompt_template:  "<smile intensity: {value:.3f}>"
  emotion_filter:   "happy"

unet_additional_kwargs:
  use_motion_module:               true
  motion_module_resolutions:       [1, 2, 4, 8]
  unet_use_cross_frame_attention:  false
  unet_use_temporal_attention:     false
  motion_module_mid_block:         false
  motion_module_type:              Vanilla
  motion_module_kwargs:
    num_attention_heads:                 8
    num_transformer_block:               1
    attention_block_types:               ["Temporal_Self", "Temporal_Self"]
    temporal_position_encoding:          true
    temporal_position_encoding_max_len:  32
    temporal_attention_dim_div:          1
    zero_initialize:                     false

lora_rank:           2
lora_scale:          1.0
lora_ckpt:           "/path/to/RealEstate10K_LoRA.ckpt"
motion_module_ckpt:  "/path/to/v3_sd15_mm.ckpt"
motion_lora_rank:    0
motion_lora_scale:   1.0

# 6 input channels (3 physical intensity + 3 CCL) * downscale_factor**2 (8**2=64) = 384.
# Keep cin: 384 unless you change the channel layout in expression_dataset.py.
camera_encoder_kwargs:
  downscale_factor:                    8
  channels:                            [320, 640, 1280, 1280]
  nums_rb:                             2
  cin:                                 384
  ksize:                               1
  sk:                                  true
  use_conv:                            false
  compression_factor:                  1
  temporal_attention_nhead:            8
  attention_block_types:               ["Temporal_Self"]
  temporal_position_encoding:          true
  temporal_position_encoding_max_len:  16

attention_processor_kwargs:
  add_spatial:               false
  spatial_attn_names:        'attn1'
  add_temporal:              true
  temporal_attn_names:       '0'
  camera_feature_dimensions: [320, 640, 1280, 1280]
  query_condition:           true
  key_value_condition:       true
  scale:                     1.0

noise_scheduler_kwargs:
  num_train_timesteps:  1000
  beta_start:           0.00085
  beta_end:             0.012
  beta_schedule:        "linear"
  steps_offset:         1
  clip_sample:          false

do_sanity_check: true

max_train_epoch:        -1
max_train_steps:        25000
validation_steps:       5000
validation_steps_tuple: [200]

learning_rate: 1.e-4

# 96 Xeon cores / 4 tasks per node (--ntasks-per-node=4, --cpus-per-task=24 in the
# .srm script) leaves headroom above num_workers per task; tune alongside
# --cpus-per-task, not in isolation.
num_workers:           12
train_batch_size:      1
# 1 node x 4 GPUs x accumulation 1 = effective batch 4, matching the RTX-3090
# baseline (1 GPU x accumulation 4); lr_warmup_steps=0 + constant LR, so the
# schedule is identical too.
gradient_accumulation_steps: 1
checkpointing_epochs:  -1
checkpointing_steps:   5000

mixed_precision_training: true
global_seed:              42
logger_interval:          50

# Cap each validation event to 8 clips (~70 s) instead of all 176 (~25 min).
max_validation_samples: 8
